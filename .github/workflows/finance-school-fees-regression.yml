name: MARKAZ Finance School Fees Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/finance.html'
      - 'public/js/finance.js'
      - 'public/js/student-fees-calendar.js'
      - 'public/css/student-fees-calendar.css'
      - 'public/css/finance.css'
      - 'public/settings.html'
      - 'public/js/settings.js'
      - 'public/css/settings.css'
      - 'public/api/settings/academic-period.php'
      - 'app/helpers/finance.php'
      - 'app/helpers/finance-fee-calculations.php'
      - 'database/migrations/20261129_markaz_section_student_fees.sql'
      - 'database/migrations/20261130_markaz_student_fee_intake_overrides.sql'
      - 'scripts/install-finance.sh'
      - 'api/finance/**'
      - 'tests/finance-term-fees-regression.test.php'
      - 'tests/student-fees-section-regression.test.php'
      - 'tests/finance-migration-installer.test.php'
      - 'tests/finance-student-fees-experience-regression.test.php'
      - '.github/workflows/finance-school-fees-regression.yml'
  push:
    branches: [main]
    paths:
      - 'public/finance.html'
      - 'public/js/finance.js'
      - 'public/js/student-fees-calendar.js'
      - 'public/css/student-fees-calendar.css'
      - 'public/css/finance.css'
      - 'public/settings.html'
      - 'public/js/settings.js'
      - 'public/css/settings.css'
      - 'public/api/settings/academic-period.php'
      - 'app/helpers/finance.php'
      - 'app/helpers/finance-fee-calculations.php'
      - 'database/migrations/20261129_markaz_section_student_fees.sql'
      - 'database/migrations/20261130_markaz_student_fee_intake_overrides.sql'
      - 'scripts/install-finance.sh'
      - 'api/finance/**'
      - 'tests/finance-term-fees-regression.test.php'
      - 'tests/student-fees-section-regression.test.php'
      - 'tests/finance-migration-installer.test.php'
      - 'tests/finance-student-fees-experience-regression.test.php'
      - '.github/workflows/finance-school-fees-regression.yml'

jobs:
  school-fees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Finance PHP syntax
        run: |
          php -l api/finance/index.php
          php -l api/finance/term-fees.php
          php -l app/helpers/finance.php
          php -l app/helpers/finance-fee-calculations.php
          php -l public/api/settings/academic-period.php
          php -l tests/finance-term-fees-regression.test.php
          php -l tests/student-fees-section-regression.test.php
          php -l tests/finance-migration-installer.test.php
          php -l tests/finance-student-fees-experience-regression.test.php
          bash -n scripts/install-finance.sh
      - name: Check Finance and Settings JavaScript syntax
        run: |
          node --check public/js/finance.js
          node --check public/js/student-fees-calendar.js
          node --check public/js/settings.js
      - name: Run School Fees and Finance regression tests
        run: |
          php tests/finance-term-fees-regression.test.php
          php tests/student-fees-section-regression.test.php
          php tests/finance-migration-installer.test.php
          php tests/finance-student-fees-experience-regression.test.php

  section-fees-migration:
    runs-on: ubuntu-latest
    env:
      MARIADB_ROOT_PASSWORD: root
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: markaz_section_fees_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Build minimal existing MARKAZ schema
        run: |
          mariadb --protocol=TCP -h127.0.0.1 -uroot -proot markaz_section_fees_test <<'SQL'
          CREATE TABLE admins (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, name VARCHAR(160) NOT NULL) ENGINE=InnoDB;
          CREATE TABLE academic_sessions (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, name VARCHAR(50) NOT NULL, is_current TINYINT(1) NOT NULL DEFAULT 0) ENGINE=InnoDB;
          CREATE TABLE terms (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, name VARCHAR(40) NOT NULL) ENGINE=InnoDB;
          CREATE TABLE academic_periods (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, academic_session_id BIGINT UNSIGNED NOT NULL, term_id BIGINT UNSIGNED NOT NULL, is_current TINYINT(1) NOT NULL DEFAULT 0) ENGINE=InnoDB;
          CREATE TABLE finance_academic_sessions (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, session_name VARCHAR(30) NOT NULL UNIQUE, starts_on DATE NULL, ends_on DATE NULL) ENGINE=InnoDB;
          CREATE TABLE classes (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, name VARCHAR(80) NOT NULL) ENGINE=InnoDB;
          CREATE TABLE students (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, class_id BIGINT UNSIGNED NOT NULL, student_type ENUM('Day Student','Boarding') NOT NULL DEFAULT 'Day Student') ENGINE=InnoDB;
          CREATE TABLE finance_term_fee_invoices (
            id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
            session_id BIGINT UNSIGNED NOT NULL,
            student_id BIGINT UNSIGNED NOT NULL,
            class_id BIGINT UNSIGNED NOT NULL,
            amount_due DECIMAL(14,2) NOT NULL,
            discount_amount DECIMAL(14,2) NOT NULL DEFAULT 0,
            status ENUM('unpaid','partial','paid','void') NOT NULL DEFAULT 'unpaid'
          ) ENGINE=InnoDB;
          INSERT INTO admins(name) VALUES ('Migration Test Admin');
          INSERT INTO academic_sessions(name,is_current) VALUES ('2026/2027',1);
          INSERT INTO terms(name) VALUES ('Second Term');
          INSERT INTO academic_periods(academic_session_id,term_id,is_current) VALUES (1,1,1);
          INSERT INTO finance_academic_sessions(session_name) VALUES ('2026/2027');
          INSERT INTO classes(name) VALUES ('Basic JSS 1'),('Basic 6'),('SS1'),('Kindergarten'),('Basic 1');
          INSERT INTO students(class_id,student_type) VALUES (1,'Boarding'),(2,'Day Student'),(3,'Boarding'),(4,'Day Student'),(5,'Day Student');
          INSERT INTO finance_term_fee_invoices(session_id,student_id,class_id,amount_due,discount_amount,status)
            VALUES (1,1,1,90000.00,0.00,'unpaid'),(1,2,2,60000.00,0.00,'unpaid'),(1,3,3,80000.00,0.00,'unpaid'),(1,4,4,30000.00,0.00,'unpaid'),(1,5,5,40000.00,0.00,'unpaid');
          SQL
      - name: Apply section-based student-fee migration
        run: mariadb --protocol=TCP -h127.0.0.1 -uroot -proot markaz_section_fees_test < database/migrations/20261129_markaz_section_student_fees.sql
      - name: Apply per-student intake override migration
        run: mariadb --protocol=TCP -h127.0.0.1 -uroot -proot markaz_section_fees_test < database/migrations/20261130_markaz_student_fee_intake_overrides.sql
      - name: Verify per-student intake override storage
        run: |
          mariadb --protocol=TCP -h127.0.0.1 -uroot -proot markaz_section_fees_test -e "INSERT INTO finance_student_fee_intake_overrides(academic_period_id,student_id,intake_type,created_by,updated_by) VALUES (1,1,'new_intake',1,1)"
          override="$(mariadb --protocol=TCP -h127.0.0.1 -uroot -proot -N markaz_section_fees_test -e "SELECT CONCAT(academic_period_id,':',student_id,':',intake_type) FROM finance_student_fee_intake_overrides WHERE student_id=1")"
          test "$override" = "1:1:new_intake"
      - name: Verify term dates, untouched historical invoices and new fee schedules
        run: |
          columns="$(mariadb --protocol=TCP -h127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -N markaz_section_fees_test -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='markaz_section_fees_test' AND TABLE_NAME='academic_periods' AND COLUMN_NAME IN ('starts_on','ends_on')")"
          test "$columns" = "2"
          historical="$(mariadb --protocol=TCP -h127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -N markaz_section_fees_test -e "SELECT CONCAT(COALESCE(i.section,'NULL'),':',COALESCE(i.student_type,'NULL'),':',COALESCE(i.intake_type,'NULL'),':',FORMAT(i.amount_due,2),':',i.status) FROM finance_term_fee_invoices i WHERE i.student_id=1")"
          test "$historical" = "NULL:NULL:NULL:90,000.00:unpaid"
          historical_count="$(mariadb --protocol=TCP -h127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -N markaz_section_fees_test -e "SELECT COUNT(*) FROM finance_term_fee_invoices WHERE section IS NOT NULL OR student_type IS NOT NULL OR intake_type IS NOT NULL")"
          test "$historical_count" = "0"
          mariadb --protocol=TCP -h127.0.0.1 -uroot -proot markaz_section_fees_test -e "INSERT INTO finance_section_fee_schedules(academic_period_id,section,student_type,intake_type,amount,due_on,created_by) VALUES (1,'primary','Day Student','new_intake',55000.00,'2027-03-01',1)"
          schedule="$(mariadb --protocol=TCP -h127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -N markaz_section_fees_test -e "SELECT CONCAT(section,':',student_type,':',intake_type,':',FORMAT(amount,2)) FROM finance_section_fee_schedules WHERE academic_period_id=1")"
          test "$schedule" = "primary:Day Student:new_intake:55,000.00"
