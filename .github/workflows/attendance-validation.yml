name: Daily Attendance Validation

on:
  pull_request:
    paths:
      - "api/attendance/**"
      - "api/results/**"
      - "public/js/class.js"
      - "public/css/dashboard.css"
      - "tests/results-class-type-validation.test.php"
      - "public/api/attendance/**"
      - "public/attendance.html"
      - "public/css/standard-page-heading.css"
      - "public/css/attendance.css"
      - "public/js/attendance.js"
      - "public/dashboard.html"
      - "public/js/dashboard.js"
      - "api/dashboard/**"
      - "tests/dashboard-progress-validation.test.php"
      - "tests/dashboard-report-regression.test.php"
      - "tests/dashboard-layout-attendance-access.test.php"
      - "database/migrations/20261028_daily_attendance.sql"
      - "tests/attendance-validation.test.php"
      - ".github/workflows/attendance-validation.yml"
  push:
    branches:
      - "main"
      - "feature/daily-attendance-20261028"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Check PHP syntax
        run: |
          php -l api/results/class.php
          php -l api/results/save.php
          php -l api/results/class-completion.php
          php -l tests/results-class-type-validation.test.php
          php -l api/attendance/_common.php
          php -l api/attendance/classes.php
          php -l api/attendance/register.php
          php -l api/attendance/reports.php
          php -l public/api/attendance/classes.php
          php -l public/api/attendance/register.php
          php -l tests/attendance-validation.test.php
          php -l api/dashboard/_progress.php
          php -l api/dashboard/stats.php
          php -l tests/dashboard-progress-validation.test.php
          php -l tests/dashboard-report-regression.test.php
          php -l tests/dashboard-layout-attendance-access.test.php

      - name: Run result class-type validation tests
        run: php tests/results-class-type-validation.test.php

      - name: Run attendance validation tests
        run: php tests/attendance-validation.test.php

      - name: Run dashboard progress regression tests
        run: php tests/dashboard-progress-validation.test.php

      - name: Run dashboard report regression tests
        run: php tests/dashboard-report-regression.test.php

      - name: Run dashboard layout and access regression tests
        run: php tests/dashboard-layout-attendance-access.test.php

      - name: Check JavaScript syntax
        run: |
          node --check public/js/class.js
          node --check public/js/attendance.js
          node --check public/js/dashboard.js
