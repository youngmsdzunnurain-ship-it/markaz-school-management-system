name: MARKAZ Targeted Regression Tests

on:
  push:
    branches:
      - main
      - fix/academic-period-current-term-signature-baseline-20261106
      - fix/targeted-result-print-flow-20261106
  pull_request:
    branches:
      - main

jobs:
  php-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run academic-period, signature, and print-result regression tests
        run: |
          set -e
          php -l api/attendance/periods.php
          php -l api/attendance/history.php
          php -l api/attendance/register.php
          php -l tests/attendance-academic-history.test.php
          node --check public/js/attendance.js
          php tests/attendance-academic-history.test.php
          php -l api/settings/finalize-academic-period.php
          php -l public/api/settings/academic-period.php
          php -l api/results/save.php
          php -l api/results/behavioural.php
          php -l api/results/student-portal.php
          php -l tests/academic-result-archive.test.php
          php -l api/settings/memorization.php
          php -l public/api/settings/login-lockouts.php
          php -l tests/settings-memorization-social-lockouts.test.php
          node --check public/js/settings.js
          node --check public/js/markaz-global.js
          php tests/settings-memorization-social-lockouts.test.php
          php -l app/helpers/result-progress.php
          php -l public/api/dashboard/stats.php
          php -l tests/dashboard-result-progress.test.php
          php tests/dashboard-result-progress.test.php
          node --check public/js/dashboard.js
          node --check public/js/class.js
          node --check public/js/settings-panel-navigation.js
          php -l tests/admin-settings-profile-first-render.test.php
          php tests/admin-settings-profile-first-render.test.php
          php tests/academic-result-archive.test.php
          php tests/academic-period-selection.test.php
          php tests/result-footer-signatures.test.php
          php tests/result-print-current-period.test.php
          php -l api/settings/accounts.php
          php -l api/settings/admin-profile.php
          php -l api/students/create.php
          php -l api/students/update.php
          php -l api/students/toggle-status.php
          php -l api/arabic-classes/list.php
          php -l app/middleware/auth.php
          php -l api/auth/me.php
          php -l api/classes/list.php
          php -l api/students/list.php
          php -l api/results/student.php
          php -l api/results/class-completion.php
          php -l tests/teacher-document-permissions.test.php
          php -l tests/management-permissions-profile-dashboard-regression.test.php
          node --check public/js/management-shell.js
          node --check public/js/settings.js
          node --check public/js/settings-panel-navigation.js
          node --check public/js/account-management.js
          node --check public/js/dashboard.js
          node --check public/js/class.js
          node --check public/js/student-result.js
          node --check public/js/print-results.js
          php tests/teacher-document-permissions.test.php
          php tests/management-permissions-profile-dashboard-regression.test.php
          php -l tests/exam-officer-portal.test.php
          php tests/exam-officer-portal.test.php
          php -l tests/staff-profile-crop-dashboard-motion.test.php
          php tests/staff-profile-crop-dashboard-motion.test.php
          php tests/settings-role-first-dashboard-order.test.php
          php tests/settings-dashboard-polish-regression.test.php
          php -l tests/teacher-portal-dashboard.test.php
          php tests/teacher-portal-dashboard.test.php
          php tests/result-print-flow-isolation.test.php
          php tests/student-result-display-regression.test.php
          php -l tests/result-performance-calculation.test.php
          php tests/result-performance-calculation.test.php
          php tests/shared-public-footer.test.php
          php tests/public-footer-spacing.test.php
          php tests/public-interaction-motion.test.php
          php tests/public-visual-hierarchy.test.php
          php -l tests/public-seo.test.php
          php tests/public-seo.test.php
          php tests/public-network-resilience.test.php
          node --check public/js/public-resilience.js
          node --check public/sw.js

  login-lockout-and-dashboard-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify login lockout and dashboard motion
        run: |
          set -e
          php -l app/helpers/login-lockout.php
          php -l api/results/student-portal.php
          php -l api/online-class/student-login.php
          php -l tests/login-lockout-coverage.test.php
          node --check public/js/login.js
          node --check public/js/student-results-portal.js
          node --check public/js/online-class-login.js
          node --check public/js/dashboard.js
          php tests/login-lockout-coverage.test.php
          php tests/student-portal-flow.test.php
          php tests/online-class-portal-ui-regression.test.php
          php tests/staff-profile-crop-dashboard-motion.test.php

  teacher-document-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify teacher portal permission boundaries
        run: |
          set -e
          php -l api/settings/accounts.php
          php -l app/middleware/auth.php
          php -l api/auth/me.php
          php -l api/classes/list.php
          php -l api/students/list.php
          php -l api/results/student.php
          php -l tests/teacher-document-permissions.test.php
          node --check public/js/account-management.js
          node --check public/js/dashboard.js
          node --check public/js/class.js
          node --check public/js/student-result.js
          php tests/teacher-document-permissions.test.php

  management-permissions-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify Management permission boundaries and profile workflow
        run: |
          set -e
          php -l app/middleware/auth.php
          php -l api/auth/me.php
          php -l api/settings/accounts.php
          php -l api/settings/admin-profile.php
          php -l api/attendance/_common.php
          php -l api/attendance/classes.php
          php -l api/attendance/reports.php
          php -l api/classes/list.php
          php -l api/arabic-classes/list.php
          php -l api/students/list.php
          php -l api/students/create.php
          php -l api/students/update.php
          php -l api/students/toggle-status.php
          php -l tests/management-permissions-profile-dashboard-regression.test.php
          node --check public/js/dashboard.js
          node --check public/js/settings.js
          node --check public/js/settings-panel-navigation.js
          node --check public/js/account-management.js
          node --check public/js/management-shell.js
          php tests/management-permissions-profile-dashboard-regression.test.php

  online-class-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify MARKAZ Online Class module
        run: |
          set -e
          php -l app/helpers/online-class.php
          php -l api/online-class/index.php
          php -l api/online-class/student-login.php
          php -l api/online-class/student-footer.php
          php -l api/online-class/logout.php
          php -l api/online-class/student-results.php
          php -l api/online-class/footer.php
          php -l api/auth/login.php
          php -l api/auth/me.php
          php -l api/settings/accounts.php
          php -l tests/online-class-regression.test.php
          node --check public/js/online-class.js
          node --check public/js/online-class-login.js
          node --check public/js/online-class-portal.js
          node --check public/js/account-management.js
          node --check public/js/dashboard.js
          php tests/online-class-regression.test.php

  online-class-module:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Check Online Class PHP syntax
        run: |
          set -e
          php -l app/helpers/online-class.php
          php -l api/online-class/index.php
          php -l api/online-class/student-login.php
          php -l api/online-class/student-results.php
          php -l api/online-class/logout.php
          php -l api/auth/login.php
          php -l api/auth/me.php
          php -l api/settings/accounts.php
          php -l app/middleware/auth.php
          php -l tests/online-class-module-regression.test.php
          php -l tests/online-class-architecture-regression.test.php
      - name: Check Online Class JavaScript syntax
        run: |
          set -e
          node --check public/js/online-class.js
          node --check public/js/online-class-portal.js
          node --check public/js/dashboard.js
          node --check public/js/account-management.js
      - name: Run Online Class regression tests
        run: |
          php tests/online-class-module-regression.test.php
          php tests/online-class-architecture-regression.test.php
