name: MARKAZ AI Security and UI Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/ai/**'
      - 'app/helpers/markaz-ai.php'
      - 'database/migrations/20261116_markaz_ai_foundation.sql'
      - 'public/api/ai/**'
      - 'public/js/markaz-ai.js'
      - 'public/css/markaz-ai.css'
      - 'api/results/save.php'
      - 'tests/markaz-ai-security-regression.test.php'
      - '.github/workflows/markaz-ai.yml'

jobs:
  markaz-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Git whitespace
        run: git diff --check origin/main...HEAD
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check PHP syntax
        run: |
          set -e
          php -l app/helpers/markaz-ai.php
          php -l api/ai/chat.php
          php -l api/ai/context.php
          php -l api/ai/conversations.php
          php -l api/ai/history.php
          php -l api/ai/delete-conversation.php
          php -l api/ai/scan-result.php
          php -l api/ai/admin-activity.php
          php -l api/ai/student-context.php
          php -l api/ai/student-chat.php
          php -l api/ai/student-conversations.php
          php -l api/ai/student-history.php
          php -l api/ai/student-delete-conversation.php
          php -l api/ai/transcribe.php
          php -l api/ai/student-transcribe.php
          php -l public/api/ai/chat.php
          php -l public/api/ai/context.php
          php -l public/api/ai/conversations.php
          php -l public/api/ai/history.php
          php -l public/api/ai/delete-conversation.php
          php -l public/api/ai/scan-result.php
          php -l public/api/ai/admin-activity.php
          php -l public/api/ai/student-context.php
          php -l public/api/ai/student-chat.php
          php -l public/api/ai/student-conversations.php
          php -l public/api/ai/student-history.php
          php -l public/api/ai/student-delete-conversation.php
          php -l public/api/ai/transcribe.php
          php -l public/api/ai/student-transcribe.php
          php -l api/results/save.php
          php -l api/attendance/register.php
          php -l tests/markaz-ai-security-regression.test.php
      - name: Check JavaScript syntax
        run: |
          node --check public/js/markaz-ai.js
          node --check public/js/management-shell.js
      - name: Run MARKAZ AI security regression checks
        run: php tests/markaz-ai-security-regression.test.php
