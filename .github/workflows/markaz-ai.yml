name: MARKAZ Results Scanner and Staff Chat Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/results/save.php'
      - 'public/class.html'
      - 'public/js/class.js'
      - 'public/js/results-scanner.js'
      - 'public/css/results-scanner.css'
      - 'public/dashboard.html'
      - 'public/js/management-shell.js'
      - 'public/staff-chat.html'
      - 'public/js/staff-chat.js'
      - 'tests/results-scanner-workflow.test.php'
      - '.github/workflows/markaz-ai.yml'

jobs:
  results-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Git whitespace
        run: git diff --check origin/main...HEAD
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check PHP syntax
        run: |
          php -l api/results/save.php
          php -l tests/results-scanner-workflow.test.php
      - name: Check JavaScript syntax
        run: |
          node --check public/js/class.js
          node --check public/js/results-scanner.js
          node --check public/js/staff-chat.js
          node --check public/js/management-shell.js
      - name: Run results scanner regression checks
        run: php tests/results-scanner-workflow.test.php
