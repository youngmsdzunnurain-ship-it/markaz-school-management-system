name: Website Image Manager Regression

on:
  pull_request:
    branches: [main]

jobs:
  website-image-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify image manager workflow and portrait fit
        run: |
          set -e
          php -l app/helpers/website-image-storage.php
          php -l public/api/settings/website-images.php
          php -l tests/website-image-manager-fit.test.php
          php -l tests/website-image-manager-save.test.php
          php -l tests/website-image-manager-persistence.test.php
          php -l tests/public-navigation-performance.test.php
          php -l tests/settings-role-first-dashboard-order.test.php
          node --check public/js/website-image-manager.js
          node --check public/js/settings-panel-navigation.js
          node --check public/js/home.js
          node --check public/sw.js
          php tests/website-image-manager-fit.test.php
          php tests/website-image-manager-save.test.php
          php tests/website-image-manager-persistence.test.php
          php tests/website-image-storage.test.php
          php tests/public-navigation-performance.test.php
          php tests/settings-role-first-dashboard-order.test.php
