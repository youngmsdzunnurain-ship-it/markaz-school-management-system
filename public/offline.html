<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#124b32">
    <title>You're Offline | MARKAZ</title>
    <style>
        :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #24352c; background: #f5f8f5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 480px); padding: 36px; border: 1px solid #dce9df; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(8,47,32,.1); text-align: center; }
        .mark { display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 50%; color: #174b32; background: #edf5ef; font-size: 28px; }
        h1 { margin: 0 0 10px; color: #174b32; font-size: clamp(1.5rem, 5vw, 2rem); }
        p { margin: 0; color: #58675d; line-height: 1.7; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 25px; }
        a, button { min-height: 44px; padding: 11px 18px; border: 1px solid #1c6845; border-radius: 10px; color: #fff; background: #1c6845; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
        a.secondary { color: #174b32; background: #edf5ef; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">⌁</div>
        <h1>You're temporarily offline</h1>
        <p>MARKAZ could not reach the page because your internet connection is unavailable or too slow. Please reconnect and try again. Previously opened public pages may still be available from your browser cache.</p>
        <div class="actions">
            <button type="button" onclick="location.reload()">Try again</button>
            <a class="secondary" href="./home.html">Go to home</a>
        </div>
    </main>
</body>
</html>
