<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d32"><title>Online Class Student Login | MARKAZ</title><link rel="icon" href="assets/images/markaz-logo.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/online-class.css?v=20261110-online-class-portal-v2"><style>.online-login-shell{max-width:540px;margin:5vh auto;padding:20px}.online-login-card{background:#fff;border:1px solid #e1e9de;border-radius:20px;padding:30px;box-shadow:0 18px 50px #1b462114}.online-login-brand{text-align:center;margin-bottom:22px}.online-login-brand img{width:82px;height:82px;object-fit:contain}.online-login-brand h1{color:#205d38;margin:8px 0}.online-login-card label{display:block;font-weight:700;margin:12px 0 6px}.online-login-card input,.online-login-card select{width:100%;padding:12px;border:1px solid #dce5da;border-radius:9px;font:inherit;background:#fff}.online-login-card button{width:100%;margin-top:20px}.online-login-message{margin-top:14px;color:#a33;min-height:20px}.online-login-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:480px){.online-login-grid{grid-template-columns:1fr}.online-login-card{padding:22px}}</style></head>
<body><main class="online-login-shell"><section class="online-login-card"><div class="online-login-brand"><img src="assets/images/markaz-logo.jpg" alt="MARKAZ logo"><h1>MARKAZ</h1><span>ONLINE CLASS STUDENT PORTAL</span></div><p>Enter your admission number, level, section, academic session and term to view your released result.</p><form id="onlineLoginForm"><div class="online-login-grid"><div><label for="onlineAdmission">Admission number</label><input id="onlineAdmission" autocomplete="username" placeholder="MOC-2026-000001" required></div><div><label for="onlineLevel">Level</label><select id="onlineLevel" required><option value="">Loading levels…</option></select></div><div><label for="onlineSection">Section</label><select id="onlineSection" required disabled><option value="">Select level first</option></select></div><div><label for="onlineSession">Academic session</label><input id="onlineSession" value="2026/2027" pattern="\d{4}/\d{4}" required></div><div><label for="onlineTerm">Term</label><select id="onlineTerm" required><option value="First Term">First Term</option><option value="Second Term">Second Term</option><option value="Third Term">Third Term</option></select></div></div><button id="onlineLoginButton" class="online-btn primary" type="submit">Check Results</button><p id="onlineLoginMessage" class="online-login-message" role="status" aria-live="polite"></p></form><p style="text-align:center"><a href="student-login.html">Conventional / Arabic student results</a></p></section></main><script src="js/online-class-login.js?v=20261110-portal-v2"></script></body></html>
