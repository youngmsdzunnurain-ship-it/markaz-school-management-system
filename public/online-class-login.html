<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d32"><title>Online Class Student Login | MARKAZ</title><link rel="icon" href="assets/images/markaz-logo.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/online-class.css?v=20261110-portal"><style>.online-login-shell{max-width:520px;margin:6vh auto;padding:20px}.online-login-card{background:#fff;border:1px solid #e1e9de;border-radius:20px;padding:32px;box-shadow:0 18px 50px #1b462114}.online-login-brand{text-align:center;margin-bottom:25px}.online-login-brand img{width:82px;height:82px;object-fit:contain}.online-login-brand h1{color:#205d38;margin:8px 0}.online-login-card label{display:block;font-weight:700;margin:14px 0 6px}.online-login-card input{width:100%;padding:13px;border:1px solid #dce5da;border-radius:9px;font:inherit}.online-login-card button{width:100%;margin-top:20px}.online-login-message{margin-top:14px;color:#a33}</style></head>
<body><main class="online-login-shell"><section class="online-login-card"><div class="online-login-brand"><img src="assets/images/markaz-logo.jpg" alt="MARKAZ logo"><h1>MARKAZ</h1><span>ONLINE CLASS STUDENT PORTAL</span></div><p>Sign in with the admission number and password provided by the school to view your released results.</p><form id="onlineLoginForm"><label for="onlineAdmission">Admission number</label><input id="onlineAdmission" autocomplete="username" placeholder="e.g. MOC-2026-000001" required><label for="onlinePassword">Password</label><input id="onlinePassword" type="password" autocomplete="current-password" required><button id="onlineLoginButton" class="online-btn primary" type="submit">Sign in</button><p id="onlineLoginMessage" class="online-login-message" role="status"></p></form></section></main><script src="js/online-class-login.js?v=20261110-2"></script></body></html>
