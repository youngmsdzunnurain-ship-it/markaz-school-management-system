<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MARKAZ Result System — Admin Login</title>

    <link rel="icon" href="assets/images/markaz-logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/login-shared.css?v=20261105-admin-password-reset">
    <link rel="stylesheet" href="css/website-image-polish.css">
</head>

<body>


<main class="login-page">
<section class="login-card">

            <div class="brand">
                <div class="logo-wrap">
                    <img src="assets/images/markaz-logo.jpg" alt="MARKAZ Logo">
                </div>

                <h1>MARKAZ</h1>
                <p>Centre for Learning and Memorization of the Glorious Qur’an</p>
            </div>

            <div class="login-heading">
                <h2>Admin Login</h2>
                <p>Sign in to access the MARKAZ system</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter admin email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="loginMessage" class="login-message"></div>
                <a class="forgot-password-link" href="forgot-password.html">Forgot your password?</a>

                <button type="submit" class="login-button" id="loginButton">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>



        </section>

    </main>

    <script src="js/login.js"></script>

  <script src="js/login-shared.js"></script>

<script src="js/website-image-overrides.js"></script>
</body>
</html>
