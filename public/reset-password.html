<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Reset Password | MARKAZ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/login-shared.css"><link rel="stylesheet" href="css/website-image-polish.css">
</head>
<body>
<main class="login-page"><section class="login-card">
<div class="brand"><div class="logo-wrap"><img src="assets/images/markaz-logo.jpg" alt="MARKAZ Logo"></div><h1>MARKAZ</h1><p>Centre for Learning and Memorization of the Glorious Qur’an</p></div>
<div class="login-heading"><h2>Reset Admin Password</h2><p>Create a new strong password for your administrator account.</p></div>
<form id="resetPasswordForm">
<div class="form-group"><label for="password">New Password</label><div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="password" autocomplete="new-password" minlength="12" required></div></div>
<div class="form-group"><label for="passwordConfirmation">Confirm New Password</label><div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="passwordConfirmation" autocomplete="new-password" minlength="12" required></div></div>
<p class="password-hint">At least 12 characters, including uppercase and lowercase letters, a number and a symbol.</p>
<div id="resetPasswordMessage" class="login-message" role="status" aria-live="polite"></div>
<button type="submit" class="login-button" id="resetPasswordButton"><span>Reset Password</span><i class="fa-solid fa-arrow-right"></i></button>
</form>
</section></main>
<script src="js/reset-password.js"></script><script src="js/login-shared.js"></script><script src="js/website-image-overrides.js"></script>
</body></html>
