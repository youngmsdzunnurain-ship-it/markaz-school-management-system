<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("markaz.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.dataset.theme="light";}})();</script>
<link rel="stylesheet" href="/css/markaz-theme.css?v=20261104-system2">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45"><title>Teacher Login | MARKAZ</title>
  <link rel="icon" href="assets/images/markaz-logo.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/login-roles.css">
  <link rel="stylesheet" href="css/login-shared.css"><script src="js/login-roles.js" defer></script>

    <link rel="stylesheet" href="css/website-image-polish.css">
  <link rel="stylesheet" href="css/markaz-preferences.css?v=20261103-preferences7">
  
  <script defer src="js/markaz-theme.js?v=20261103-theme4"></script>
<script defer src="/js/markaz-theme.js?v=20261104-system2"></script>
</head>
<body class="staff-login-page">
<div class="staff-login-preferences" data-markaz-preferences aria-label="Display preferences"></div>
<main class="role-login-page">
  <div class="role-decor role-decor-one"></div><div class="role-decor role-decor-two"></div>
  <section class="role-login-card">

    <div class="role-brand"><div class="role-logo"><img src="assets/images/markaz-logo.jpg" alt="MARKAZ school logo"></div><h1>MARKAZ</h1><p>Centre for Learning and Memorization of the Glorious Qur’an</p></div>
    <div class="role-heading"><span class="role-icon"><i class="fa-solid fa-chalkboard-user"></i></span><h2>Teacher Login</h2><p>Sign in to access teacher services.</p></div>
    <form class="preview-form" data-role="teacher">
      <div class="role-field"><label for="teacherUsername">Username</label><div class="role-input"><i class="fa-solid fa-user"></i><input id="teacherUsername" name="username" type="text" placeholder="Enter your teacher username" autocomplete="username" minlength="4" maxlength="60" required></div></div>
      <div class="role-field"><label for="teacherPassword">Password</label><div class="role-input"><i class="fa-solid fa-lock"></i><input id="teacherPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="role-password-toggle" type="button" data-password="teacherPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></div>
      <p class="preview-notice"><i class="fa-solid fa-circle-info"></i> Sign in using the unique username provided by the school.</p>
      <div class="role-message" aria-live="polite"></div><button class="role-submit" type="submit">Login <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <div class="role-footer"><i class="fa-solid fa-shield-halved"></i> For authorised teaching staff</div>
  </section>
</main>
  <script src="js/login-shared.js"></script>

<script src="js/website-image-overrides.js"></script>
</body>
</html>
