<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | MARKAZ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/login-shared.css"><link rel="stylesheet" href="css/website-image-polish.css">
</head>
<body>
<main class="login-page"><section class="login-card">
<div class="brand"><div class="logo-wrap"><img src="assets/images/markaz-logo.jpg" alt="MARKAZ Logo"></div><h1>MARKAZ</h1><p>Centre for Learning and Memorization of the Glorious Qur’an</p></div>
<div class="login-heading"><h2>Forgot Password?</h2><p>Enter the email address currently registered to your Admin account.</p></div>
<form id="forgotPasswordForm">
<div class="form-group"><label for="email">Admin Email Address</label><div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="email" name="email" placeholder="Enter registered admin email" autocomplete="email" required></div></div>
<div id="forgotPasswordMessage" class="login-message" role="status" aria-live="polite"></div>
<button type="submit" class="login-button" id="forgotPasswordButton"><span>Send Reset Link</span><i class="fa-solid fa-arrow-right"></i></button>
</form><a class="back-home" href="login.html">Back to Admin Login</a>
</section></main>
<script src="js/forgot-password.js"></script><script src="js/login-shared.js"></script><script src="js/website-image-overrides.js"></script>
</body></html>
